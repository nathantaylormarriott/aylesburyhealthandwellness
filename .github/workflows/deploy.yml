name: Deploy to Krystal (cPanel)

on:
  push:
    branches: [ "main" ]   # change if your default branch is different
  workflow_dispatch:

# Prevent overlapping deploys on fast pushes
concurrency:
  group: krystal-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: nathantaylormarriott/aylesburyhealthandwellness
          fetch-depth: 1

      # --- OPTIONAL BUILD STEP (uncomment if you build assets) ---
      # - name: Install Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #
      # - name: Build
      #   run: |
      #     npm ci
      #     npm run build

      - name: Deploy to Krystal via rsync
        uses: easingthemes/ssh-deploy@v4.1.8
        with:
          sshPrivateKey: ${{ secrets.SSH_PRIVATE_KEY }}    # ✅ Your private key (add in GitHub Secrets)
          remoteHost: ${{ secrets.REMOTE_HOST }}           # ✅ e.g. yourdomain.com or server hostname
          remoteUser: ${{ secrets.REMOTE_USER }}           # ✅ your cPanel username
          remotePort: 722                                  # ✅ Krystal SSH port
          source: ./                                       # what to upload (repo root)
          target: ${{ secrets.REMOTE_TARGET }}             # ✅ e.g. public_html or public_html/app
          args: -rlgoDzvc -i --delete                      # -i=items; --delete removes old files not in repo
          sshCmdArgs: -o StrictHostKeyChecking=no
