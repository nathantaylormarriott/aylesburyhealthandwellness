name: Deploy to Krystal (cPanel)

on:
  push:
    branches: [ "main" ]   # change if your default branch is different
  workflow_dispatch:

# Prevent overlapping deploys on fast pushes
concurrency:
  group: krystal-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --- OPTIONAL BUILD STEP (uncomment if you build assets) ---
      # - name: Install Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #
      # - name: Build
      #   run: |
      #     npm ci
      #     npm run build

      - name: Deploy to Krystal via rsync
        uses: easingthemes/ssh-deploy@v4.1.8
        with:
          REMOTE_PORT: 722                         # ✅ Krystal SSH port
          ARGS: -rlgoDzvc -i --delete               # -i=items; --delete to remove files not in repo (optional)
          SSH_CMD_ARGS: -o StrictHostKeyChecking=no
          SOURCE: ./                                # what to upload (repo root)
          TARGET: ${{ secrets.REMOTE_TARGET }}      # e.g. public_html or public_html/app
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}   # e.g. yourdomain.com or server hostname
          REMOTE_USER: ${{ secrets.REMOTE_USER }}   # your cPanel username
